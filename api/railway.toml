# Railway service for the Rails API (service root: api/). See docs/deploy.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand: the image's CMD (./bin/rails server) is what makes the entrypoint run
# db:prepare and storage:ensure_bucket before Puma starts on Railway's PORT.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
