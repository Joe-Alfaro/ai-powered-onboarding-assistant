# Quality gates. Runs on every push to any branch; any failing job fails the pipeline.
# Mirrors the local gates (see .husky/pre-push), plus a full-history secret scan.

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

stages:
  - check

# --- API (Rails) ---

.api:
  stage: check
  image: ruby:3.4.2
  variables:
    BUNDLE_PATH: vendor/bundle
  cache:
    key:
      files:
        - api/Gemfile.lock
    paths:
      - api/vendor/bundle
  before_script:
    - cd api
    - bundle install --jobs 4

rubocop:
  extends: .api
  script:
    - bundle exec rubocop

rspec:
  extends: .api
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: postgres
    DB_PASSWORD: postgres
    RAILS_ENV: test
  script:
    - bin/rails db:prepare
    # SimpleCov exits non-zero when an R29 core group drops below 80%.
    - bundle exec rspec
  artifacts:
    when: always
    paths:
      - api/coverage/
    expire_in: 1 week

# --- Web (Next.js) ---

.web:
  stage: check
  image: node:22
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm
  before_script:
    - cd web
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

eslint:
  extends: .web
  script:
    - npm run lint

prettier:
  extends: .web
  script:
    - npm run format:check

tsc:
  extends: .web
  script:
    - npm run typecheck

jest:
  extends: .web
  script:
    # Fails when coverage drops below the coverageThreshold in jest.config.mjs.
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - web/coverage/
    expire_in: 1 week

# --- Secrets ---

gitleaks:
  stage: check
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    # Full clone so the scan covers every commit, not just the latest.
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - gitleaks git --redact --verbose .
