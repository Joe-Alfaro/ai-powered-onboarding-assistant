# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # R17: images from uploads that were never confirmed are deleted after 1 hour.
  purge_expired_document_uploads:
    class: Documents::PurgeExpiredUploadsJob
    queue: default
    schedule: every hour

# Development runs jobs on the :async adapter, which ignores this file, so
# config/initializers/development_recurring_tasks.rb runs these entries from the dev server.
development:
  # R17: same purge as production, so a local demo doesn't keep abandoned images.
  purge_expired_document_uploads:
    class: Documents::PurgeExpiredUploadsJob
    queue: default
    schedule: every hour
